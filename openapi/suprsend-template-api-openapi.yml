      servers:
      - url: https://management-api.suprsend.com
      security:
      - ServiceTokenAuth: []
      x-codeSamples:
      - lang: cURL
        label: Upsert Variant
        source: "curl -X POST \"https://management-api.suprsend.com/v2/{workspace}/template/{template_slug}/channel/{channel}/variant/{variant_id}/\" \\\n  --header 'Authorization: ServiceToken <token>' \\\n  --header 'Content-Type: application/json' \\\n  --data '{\n    \"locale\": \"en\",\n    \"tenant_id\": null,\n    \"conditions\": [],\n    \"content\": { ... }\n  }'\n"
      parameters:
      - in: path
        name: workspace
        required: true
        schema:
          type: string
      - in: path
        name: template_slug
        required: true
        schema:
          type: string
      - in: path
        name: channel
        required: true
        schema:
          type: string
          enum:
          - email
          - sms
          - whatsapp
          - inbox
          - androidpush
          - iospush
          - webpush
          - slack
          - ms_teams
      - in: path
        name: variant_id
        required: true
        schema:
          type: string
        description: Variant identifier. If a variant with this ID doesn't exist, a new one is created.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required:
              - locale
              - content
              properties:
                locale:
                  type: string
                  description: Locale code for the variant (e.g., `en`, `es`, `fr`).
                  example: en
                tenant_id:
                  type: string
                  nullable: true
                  description: Tenant ID this variant is scoped to. `null` for the default variant.
                conditions:
                  type: array
                  description: Conditions for variant selection. Structure follows the [expression format](https://schema.suprsend.com/template/v2/variant_schema.json).
                  items:
                    type: object
                    properties:
                      type:
                        type: string
                        enum:
                        - expression_v1
                      expression_v1:
                        type: object
                        properties:
                          op:
                            type: string
                            enum:
                            - AND
                          args:
                            type: array
                            items:
                              type: object
                              properties:
                                op:
                                  type: string
                                  enum:
                                  - ==
                                variable_ns:
                                  type: string
                                variable:
                                  type: string
                                value:
                                  type: string
                content:
                  type: object
                  description: Channel-specific content. See [variant content schema](https://schema.suprsend.com/template/v2/variant_schema.json) for the structure of each channel.
                needs_vendor_approval:
                  type: boolean
                  description: '*(SMS only)* Whether this variant requires vendor (DLT) approval.'
                seq_no:
                  type: integer
                  description: Ordering of the variant within the same channel + tenant + locale combination.
                vendor_approvals:
                  type: array
                  description: Vendor approval entries for WhatsApp/SMS variants. See [approval schema](https://schema.suprsend.com/template/v2/variant_schema.json).
                  items:
                    type: object
      responses:
        '200':
          description: Variant created or updated successfully. Returns the full variant including rendered content.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/TemplateVariant'
              example:
