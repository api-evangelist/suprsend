  /v2/{workspace}/template/{template_slug}/mock_data/:
    get:
      summary: Get Mock Data
      description: Retrieve the mock data (input payload, recipient, tenant, actor settings) for a template. Used for previewing and testing.
      operationId: get-mock-data-v2
      servers:
      - url: https://management-api.suprsend.com
      security:
      - ServiceTokenAuth: []
      x-codeSamples:
      - lang: cURL
        label: Get Mock Data
        source: "curl -X GET \"https://management-api.suprsend.com/v2/{workspace}/template/{template_slug}/mock_data/?mode=draft\" \\\n  --header 'Authorization: ServiceToken <token>'\n"
      parameters:
      - in: path
        name: workspace
        required: true
        schema:
          type: string
      - in: path
        name: template_slug
        required: true
        schema:
          type: string
      - in: query
        name: mode
        schema:
          type: string
          enum:
          - draft
          - live
          default: draft
      responses:
        '200':
          description: Mock data retrieved. Returns both the raw `data` (what the user configured) and the `transformed_data` (resolved values including tenant, recipient, actor properties, and batched events).
          content:
            application/json:
              schema:
                type: object
                properties:
                  data:
                    type: object
                    description: The raw mock data configuration set by the user.
                    properties:
                      payload:
                        type: object
                      tenant_id:
                        type: string
                        nullable: true
                      is_batch:
                        type: boolean
                      batch_count:
                        type: integer
                      recipient_sub_type:
                        type: string
                        enum:
                        - user
                        - object
                      recipient_object:
                        type: object
                        nullable: true
                      recipient_distinct_id:
                        type: string
                        nullable: true
                      actor_sub_type:
                        type: string
                        enum:
                        - user
                        - object
                      actor_object:
                        type: object
                        nullable: true
                      actor_distinct_id:
                        type: string
                        nullable: true
                  transformed_data:
                    type: object
                    description: Resolved data used for rendering previews - includes tenant branding, recipient/actor profiles, batched events, and preference URLs.
              example:
                data:
                  payload:
                    order_id: ORD-8821
                    order_total: $149.99
                    delivery_date: '2026-04-10'
                    tracking_url: https://yourapp.com/track/ORD-8821
                  tenant_id: tenant_abc
                  is_batch: false
                  batch_count: 2
                  recipient_sub_type: user
                  recipient_object: null
                  recipient_distinct_id: user_12345
                  actor_sub_type: user
                  actor_object: null
                  actor_distinct_id: null
                transformed_data:
                  order_id: ORD-8821
                  order_total: $149.99
                  delivery_date: '2026-04-10'
                  tracking_url: https://yourapp.com/track/ORD-8821
                  $batch_key: evaluated batch_key
                  $batched_events:
                  - order_id: ORD-8821
                    order_total: $149.99
                  - order_id: ORD-8821
                    order_total: $149.99
                  $batched_events_count: 2
                  $brand:
                    brand_id: tenant_abc
                    brand_name: Acme Inc.
                    logo: https://cdn.acme.com/logo.png
                    primary_color: '#1a73e8'
                    secondary_color: '#34a853'
                    tertiary_color: '#ffffff'
                    embedded_preference_url: https://preferences.example.com/embed
                    hosted_preference_domain: preferences.example.com
                    blocked_channels: null
                    social_links:
                      website: https://www.example.com
                      linkedin: https://linkedin.com/company/example
                      twitter: ''
                    properties: {}
                    timezone: America/New_York
                  $user:
                    name: Jamie Rivera
                    email: jamie.rivera@example.com
                  $recipient:
                    name: Jamie Rivera
                    email: jamie.rivera@example.com
                  $actor: {}
                  $embedded_preference_url: https://preferences.example.com/embed
                  $hosted_preference_url: https://preferences.example.com/?key=xxxxxxxxxxxxxxx
        '404':
          $ref: '#/components/responses/NotFoundError'
        '401':
          $ref: '#/components/responses/AuthenticationError'
      tags:
      - Template
    patch:
      summary: Update Mock Data
      description: Update the mock data for a template. Sets the input payload, recipient, tenant, actor, and batching configuration used for previews and testing.
      operationId: update-mock-data-v2
      servers:
      - url: https://management-api.suprsend.com
      security:
      - ServiceTokenAuth: []
      x-codeSamples:
      - lang: cURL
        label: Update Mock Data
        source: "curl -X PATCH \"https://management-api.suprsend.com/v2/{workspace}/template/{template_slug}/mock_data/\" \\\n  --header 'Authorization: ServiceToken <token>' \\\n  --header 'Content-Type: application/json' \\\n  --data '{\n    \"payload\": {\"order_id\": \"ORD-1234\", \"amount\": \"$99.99\"},\n    \"tenant_id\": \"default\",\n    \"is_batch\": false,\n    \"recipient_sub_type\": \"user\",\n    \"recipient_distinct_id\": \"user-123\"\n  }'\n"
      parameters:
      - in: path
        name: workspace
        required: true
        schema:
          type: string
      - in: path
        name: template_slug
        required: true
        schema:
          type: string
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              properties:
                payload:
                  type: object
                  description: Input payload data with sample variable values.
                tenant_id:
                  type: string
                  description: Tenant ID for preview.
                  example: default
                is_batch:
                  type: boolean
                  description: Whether to simulate batched/digest data.
                  default: false
                batch_count:
                  type: integer
                  description: Number of batched events to simulate (only relevant when `is_batch` is true).
                  example: 2
                recipient_sub_type:
                  type: string
                  enum:
                  - user
                  - object
                  description: Type of recipient.
                  example: user
                recipient_distinct_id:
                  type: string
                  description: Distinct ID of the test recipient (when `recipient_sub_type` is `user`).
                  example: user-123
                recipient_object:
                  type: object
                  description: Object identifier (when `recipient_sub_type` is `object`).
                  properties:
                    object_type:
                      type: string
                    id:
                      type: string
                actor_sub_type:
                  type: string
                  enum:
                  - user
                  - object
                  description: Type of actor.
                actor_distinct_id:
                  type: string
                  description: Distinct ID of the actor user.
                actor_object:
                  type: object
                  description: Object identifier for actor.
                  properties:
                    object_type:
                      type: string
                    id:
                      type: string
      responses:
        '200':
          description: Mock data updated successfully. Returns the same structure as Get Mock Data - both `data` (raw config) and `transformed_data` (resolved values).
          content:
            application/json:
              schema:
                type: object
              example:
                data:
                  payload:
                    user:
                      name: Pat Morgan
                    event:
                      status: shipped
                  tenant_id: default
                  is_batch: false
                  batch_count: 2
                  recipient_sub_type: user
