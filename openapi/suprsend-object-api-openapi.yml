              examples:
                Result:
                  value:
                    name: Status Update Alert
                    category: status-update-alert
                    description: Send me updates when account status changes
                    original_preference: opt_in
                    preference: opt_in
                    is_editable: true
                    channels:
                    - channel: email
                      preference: opt_out
                      is_editable: true
                    - channel: ms_teams
                      preference: opt_in
                      is_editable: true
                    - channel: slack
                      preference: opt_out
                      is_editable: true
              schema:
