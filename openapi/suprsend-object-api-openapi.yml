      operationId: object-preference-category
      x-codeSamples:
      - lang: cURL
        label: Object Preference Category - Opt Out Channel
        source: "curl -X PATCH \"https://hub.suprsend.com/v1/object/departments/engineering/preference/status-update-alert/\" \\\n  --header 'Authorization: Bearer __YOUR_API_KEY__' \\\n  --header 'Content-Type: application/json' \\\n  --data '{\n    \"preference\": \"opt_in\",\n    \"opt_out_channels\": [\"email\", \"slack\"]\n  }'\n"
      parameters:
      - name: tenant_id
        in: query
        description: to fetch user preferences for a particular tenant
        schema:
          type: string
      - name: object_type
        in: path
        description: Used to group similar objects together. Give plural namespace like teams, organizations, and roles.
        schema:
          type: string
        required: true
      - name: id
        in: path
        description: Unique identifier of the object in your system
        schema:
          type: string
        required: true
      - name: category_slug
        in: path
        description: notification category slug. You can get this from Notification Categories page on SuprSend dashboard -> Settings page
        schema:
          type: string
        required: true
      requestBody:
        content:
          application/json:
            schema:
              type: object
              properties:
                preference:
                  type: string
                  description: 'choose one of the options: `opt_in` if the user has allowed notification in this category and `opt_out` if user wants to discontinue notification in this category'
                  default: opt_in
                opt_out_channels:
                  type: array
                  description: Add array of channels if user wants to unsubscribe from particular channels in this category. Add channels as `email`, `sms`, `whatsapp`, `androidpush`, `inbox`, `iospush`, `slack`, `webpush`
                  items:
                    type: string
                opt_in_channels:
                  type: array
                  description: You can either pass opt_out_channels when user opts out from a channel in the category or opt_in_channels when user opts in to a channel in the category. Add channels as `email`, `sms`, `whatsapp`, `androidpush`, `inbox`, `iospush`, `slack`, `webpush`
                  items:
                    type: string
      responses:
        '202':
          description: '202'
          content:
