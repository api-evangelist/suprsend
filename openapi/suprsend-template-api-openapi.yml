  /v2/{workspace}/template/{template_slug}/commit/:
    patch:
      summary: Commit Template
      description: 'Commit the current draft version, making it live. All draft changes across all channels and variants are published as a new version.


        For WhatsApp and SMS (DLT) variants, committing moves them to **Approval Pending** state instead of going live immediately.

        '
      operationId: commit-template-v2
      servers:
      - url: https://management-api.suprsend.com
      security:
      - ServiceTokenAuth: []
      x-codeSamples:
      - lang: cURL
        label: Commit Template
        source: "curl -X PATCH \"https://management-api.suprsend.com/v2/{workspace}/template/{template_slug}/commit/?commit_message=Updated%20copy\" \\\n  --header 'Authorization: ServiceToken <token>' \\\n  --header 'Content-Type: application/json' \\\n  --data '{}'\n"
      parameters:
      - in: path
        name: workspace
        required: true
        schema:
          type: string
      - in: path
        name: template_slug
        required: true
        schema:
          type: string
      - in: query
        name: commit_message
        schema:
          type: string
        description: Description of changes in this version.
      requestBody:
        content:
          application/json:
            schema:
              type: object
      responses:
        '200':
          description: Template committed successfully. Returns the updated template detail.
          content:
            application/json:
              schema:
                type: object
              example:
                $schema: https://schema.suprsend.com/template/v2/schema.json
                slug: order-confirmed
                created_at: '2026-04-07T10:39:28.502737Z'
                last_triggered_at: null
                name: Order Confirmed
                description: Sent when an order is placed
                tags:
                - transactional
                enabled_channels:
                - email
                - sms
                status: active
                version_no: 3
                hash: 637edaabc624d09db3793829ea872a3516ed0362ce79ee3875607fc7317381b9
                commit_message: Updated subject line for Q2 campaign
                active_at: '2026-04-08T12:00:00.000000Z'
                updated_at: '2026-04-08T12:00:00.000000Z'
                updated_by:
                  name: Dana Lee
                  email: dana.lee@example.com
                channels:
                - channel: email
                  is_active: true
                  variants_count: 2
                - channel: sms
                  is_active: true
                  variants_count: 1
        '401':
          $ref: '#/components/responses/AuthenticationError'
        '404':
          $ref: '#/components/responses/NotFoundError'
      tags:
      - Template
  /v2/{workspace}/template/{template_slug}/channel/{channel}/variant/{variant_id}/discard/:
    patch:
      summary: Discard Variant
      description: 'Discard a variant that is in approval-pending state. Only applicable for WhatsApp and SMS channels that require vendor approval. The variant returns to draft state.

        '
      operationId: discard-variant-v2
      servers:
      - url: https://management-api.suprsend.com
      security:
      - ServiceTokenAuth: []
      x-codeSamples:
      - lang: cURL
        label: Discard Variant
        source: "curl -X PATCH \"https://management-api.suprsend.com/v2/{workspace}/template/{template_slug}/channel/{channel}/variant/{variant_id}/discard/?mode=live\" \\\n  --header 'Authorization: ServiceToken <token>' \\\n  --header 'Content-Type: application/json' \\\n  --data '{\"comment\": \"Content needs revision\"}'\n"
      parameters:
      - in: path
        name: workspace
        required: true
        schema:
          type: string
      - in: path
        name: template_slug
        required: true
        schema:
          type: string
      - in: path
        name: channel
        required: true
        schema:
          type: string
          enum:
          - whatsapp
          - sms
      - in: path
        name: variant_id
        required: true
        schema:
          type: string
      - in: query
        name: mode
        schema:
          type: string
          enum:
          - live
          default: live
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required:
              - comment
              properties:
                comment:
                  type: string
                  description: Reason for discarding the variant.
                  example: Content needs revision before resubmission
      responses:
        '200':
          description: Variant discarded successfully
          content:
            application/json:
              schema:
                type: object
        '401':
          $ref: '#/components/responses/AuthenticationError'
        '404':
          $ref: '#/components/responses/NotFoundError'
      tags:
      - Template
  /v2/{workspace}/template/{template_slug}/channel/{channel}/variant/{variant_id}/vendor_approval/:
    patch:
      summary: Add or Update Vendor Approval
      description: 'Add or update a vendor approval entry for a WhatsApp or SMS variant. Use this to record approval status from the vendor portal, including the vendor template ID and name.

        '
      operationId: vendor-approval-v2
      servers:
      - url: https://management-api.suprsend.com
      security:
      - ServiceTokenAuth: []
      x-codeSamples:
      - lang: cURL
        label: Approve Variant
        source: "curl -X PATCH \"https://management-api.suprsend.com/v2/{workspace}/template/{template_slug}/channel/{channel}/variant/{variant_id}/vendor_approval/?mode=live\" \\\n  --header 'Authorization: ServiceToken <token>' \\\n  --header 'Content-Type: application/json' \\\n  --data '{\n    \"approval_status\": \"approved\",\n    \"vendor_slug\": \"twilio-whatsapp\",\n    \"vendor_uid\": \"waba_id-123221\",\n    \"vendor_template_name\": \"tpl_v12\",\n    \"vendor_template_id\": \"1232\",\n    \"vendor_locale_code\": \"en\",\n    \"vendor_template_category\": \"UTILITY\"\n  }'\n"
      parameters:
      - in: path
        name: workspace
        required: true
        schema:
          type: string
      - in: path
        name: template_slug
        required: true
        schema:
          type: string
      - in: path
        name: channel
        required: true
        schema:
          type: string
          enum:
          - whatsapp
          - sms
      - in: path
        name: variant_id
        required: true
        schema:
          type: string
      - in: query
        name: mode
        schema:
          type: string
          enum:
          - live
          default: live
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required:
              - approval_status
              - vendor_slug
              - vendor_uid
              properties:
                approval_status:
                  type: string
                  enum:
                  - pending
                  - sent_for_approval
                  - approved
                  - rejected
                  description: Current approval status.
                  example: approved
                vendor_slug:
                  type: string
                  description: Slug of the vendor (e.g., `twilio-whatsapp`, `gupshup-whatsapp`, `msg91-sms`).
                  example: twilio-whatsapp
                vendor_uid:
                  type: string
                  description: Unique vendor identifier (e.g., WABA ID for WhatsApp).
                  example: waba_id-123221
                vendor_template_name:
                  type: string
                  description: '*(Required if approved)* Template name as registered at the vendor portal.'
                  example: tpl_v12
                vendor_template_id:
                  type: string
                  description: '*(Required if approved)* Template ID from the vendor portal.'
                  example: '1232'
                vendor_locale_code:
                  type: string
                  description: '*(Optional)* Locale code at the vendor end.'
                  example: en
                vendor_template_category:
                  type: string
                  description: '*(Optional)* Template category at the vendor end.'
                  enum:
                  - UTILITY
                  - MARKETING
                  - AUTHENTICATION
                  example: UTILITY
                provider_template_id:
                  type: string
                  description: '*(Optional, SMS only for msg91-sms)* Provider-level template ID.'
                comment:
                  type: string
                  description: '*(Required if rejected)* Reason for rejection.'
      responses:
        '200':
          description: Vendor approval entry updated
          content:
            application/json:
              schema:
                type: object
        '400':
          description: Validation error - one or more variants have issues
          content:
            application/json:
              schema:
                type: object
                properties:
                  code:
                    type: integer
                  error_code:
                    type: string
                  type:
                    type: string
                  message:
                    type: string
                  detail:
                    type: array
                    items:
                      type: string
              example:
                code: 400
                error_code: error
                type: ValidationError
                message: '["one of more variants about to be committed have issues.\n[1] email:default errors: {''body.raw.html'': [''missing'']}\n[2] slack:default errors: {''body_text'': [''missing'']}"]'
                detail:
                - 'one of more variants about to be committed have issues.

                  [1] email:default errors: {''body.raw.html'': [''missing'']}

                  [2] slack:default errors: {''body_text'': [''missing'']}'
        '401':
          $ref: '#/components/responses/AuthenticationError'
        '404':
          $ref: '#/components/responses/NotFoundError'
      tags:
      - Template
components:
  responses:
    NotFoundError:
      description: Resource not found
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/ErrorResponse'
          example:
            code: 404
            error_code: not_found
            type: NotFound
            message: workspace 'demo' not found
            detail: workspace 'demo' not found
    AuthenticationError:
      description: Authentication failed
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/ErrorResponse'
          example:
            code: 401
            error_code: authentication_failed
            type: AuthenticationFailed
            message: Invalid service token.
            detail: Invalid service token.
  schemas:
    TemplateVariant:
      type: object
      properties:
        $schema:
          type: string
          description: Schema URL for variant validation.
          example: https://schema.suprsend.com/template/v2/variant_schema.json
        channel:
          type: string
          description: Channel this variant belongs to.
          example: email
        id:
          type: string
          description: Variant identifier.
          example: default
        tenant_id:
          type: string
          nullable: true
          description: Tenant this variant is scoped to, or null for default.
        locale:
          type: string
          description: Locale code.
          example: en
        conditions:
          type: array
          description: Conditions for variant selection at send time.
          items:
            type: object
        hash:
          type: string
          description: Content hash for change detection.
        needs_vendor_approval:
          type: boolean
          description: Whether this variant requires vendor approval (SMS DLT, WhatsApp).
        sysgen_template_name:
          type: string
          nullable: true
          description: System-generated template name for vendor approval.
        approval_status:
          type: string
          enum:
          - auto_approved
          - pending
          - sent_for_approval
          - approved
          - rejected
          description: Current approval status of the variant.
        discard_comment:
          type: string
          nullable: true
          description: Reason provided when a variant is discarded.
        approval_at:
          type: string
          format: date-time
          nullable: true
          description: Timestamp when the variant was approved.
        has_error:
          type: boolean
          description: Whether the variant has validation errors.
        seq_no:
          type: integer
          description: Ordering within the channel + tenant + locale combination.
        action:
          type: string
          nullable: true
          description: Action taken in the latest commit (Updated, Added, Unchanged, or null).
        created_at:
          type: string
          format: date-time
          description: Timestamp when the variant was created.
        content:
          type: object
          description: Channel-specific content. Structure varies by channel. Only returned in variant detail endpoint.
        vendor_approvals:
          type: array
          description: Vendor approval entries (WhatsApp/SMS only). Only returned in variant detail endpoint.
          items:
            type: object
    ErrorResponse:
      type: object
      properties:
        code:
          type: integer
          description: HTTP status code
        error_code:
          type: string
          description: Specific error code identifier
        type:
          type: string
          description: Error type classification
        message:
          type: string
          description: Human-readable error message
        detail:
          type: string
          description: Additional error details
  securitySchemes:
    BearerAuth:
      type: http
      scheme: bearer
      bearerFormat: API_Key
      description: Pass as `Bearer <API_KEY>`. Get API Key from SuprSend dashboard Developers -> API Keys section.
    ServiceTokenAuth:
      type: apiKey
      in: header
      name: ServiceToken <token>
      description: You can get Service Token from [SuprSend dashboard -> Account Settings -> Service Tokens](https://app.suprsend.com/en/account-settings/service-tokens) section.
    sec0:
      type: apiKey
      in: header
      name: Authorization
      x-bearer-format: bearer
      description: Bearer authentication header of the form `Bearer <token>`, where <token> is your auth token.
x-readme:
  headers: []
  explorer-enabled: true
  proxy-enabled: true
x-readme-fauxas: true
